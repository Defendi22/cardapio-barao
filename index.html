<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120d0b" />
    <meta name="description" content="Cardápio digital do Barão Gastronomia — bacalhaus, carnes à bafo, porções, sobremesas e bebidas." />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Barão Gastronomia · Cardápio</title>
  </head>
  <body>
    <header class="hero">
      <img class="hero__logo" src="/logo.webp" alt="Barão Gastronomia" width="1000" height="392" />
      <p class="hero__tag">Cardápio</p>
    </header>

    <nav class="tabs" aria-label="Categorias">
      <div class="tabs__search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input id="search" type="search" placeholder="Buscar prato ou bebida" autocomplete="off" aria-label="Buscar no cardápio" />
      </div>
      <ul class="tabs__list" id="tabs"></ul>
    </nav>

    <main id="menu"></main>
    <p class="empty" id="empty" hidden>Nenhum item encontrado.</p>

    <footer class="footer">
      <img src="/logo.webp" alt="" width="1000" height="392" />
      <p>Preços em reais. Imagens meramente ilustrativas.</p>
    </footer>

    <dialog class="viewer" id="viewer">
      <button class="viewer__close" type="button" aria-label="Fechar">×</button>
      <img alt="" />
      <div class="viewer__body"></div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
